<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키즈노트 사진 전달 신청</title><link rel="stylesheet" href="/kidsnote-service.css?v=2"><link rel="stylesheet" href="/kidsnote-request-extra.css?v=2"></head><body><header class="top"><a class="brand" href="/kidsnote">키즈노트 사진 전달</a><a href="/kidsnote">처음으로</a></header><main class="request-wrap"><section class="request-card"><p class="eyebrow">DELIVERY REQUEST</p><h1>사진 전달 신청</h1><p class="lead small">신청 후 관리자가 수락하면 사진 수집이 시작되고 이메일로 다운로드 링크를 보내드립니다.</p><form id="public-request"><label><span>키즈노트 ID</span><input id="username" autocomplete="username" required placeholder="키즈노트 아이디"></label><label><span>키즈노트 비밀번호</span><input id="password" type="password" autocomplete="current-password" required placeholder="키즈노트 비밀번호"></label><label><span>받는 이메일</span><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label><span>사진 연도</span><select id="year"><option value="">전체 기간</option></select></label><fieldset class="request-options"><legend>포함 자료</legend><label class="choice-row"><input id="include-notices" type="checkbox" checked><span><b>알림장 텍스트 포함</b><small>날짜별 알림장을 UTF-8 텍스트 파일로 함께 저장합니다.</small></span></label></fieldset><label><span>전달 내용 <small>(선택)</small></span><textarea id="delivery-note" maxlength="500" placeholder="예: 당근 아이디 홍길동 / 크몽 아이디 kids123 / 주문자명"></textarea><small class="field-help">구매처 아이디나 주문자를 확인할 수 있는 내용을 적어주세요.</small></label><label class="agree"><input id="agree" type="checkbox" required><span>사진 전달 작업을 위해 키즈노트에 로그인하는 것에 동의합니다.</span></label><button id="submit" class="primary" type="submit">신청 접수하기</button></form><div id="result" class="result" hidden></div><p class="security">비밀번호는 암호화되어 대기 중에만 보관되며 관리자의 수락 또는 거절 즉시 삭제됩니다.</p></section></main><script src="/kidsnote-request.js?v=3"></script></body></html>
