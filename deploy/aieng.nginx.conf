server {
    listen 80;
    server_name minohlee.mooo.com;

    location = /photo {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
    }
    location ~ ^/(photo\.css|photo\.js)$ {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
    }
    location ^~ /api/photos {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
        proxy_read_timeout 3600s;
    }
    location ^~ /api/photo-kidsnote {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name minohlee.mooo.com;

    ssl_certificate /etc/letsencrypt/live/minohlee.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minohlee.mooo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /photo {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
    }
    location ~ ^/(photo\.css|photo\.js)$ {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
    }
    location ^~ /api/photos {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
        proxy_read_timeout 3600s;
    }
    location ^~ /api/photo-kidsnote {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
