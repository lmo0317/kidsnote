<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="theme-color" content="#f4f8f6"><title>키즈노트 사진 저장 도우미</title><link rel="icon" href="data:,"><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/photo.css?v=20260816-mobile2"></head>
<body><div class="app-shell">
  <header class="topbar"><a class="brand" href="/photo/pc"><span class="brand-mark"><i data-lucide="images"></i></span><span><strong>키즈노트 사진 저장 도우미</strong><small>날짜별 사진 다운로드</small></span></a><div class="top-actions"><a id="switch-mobile" class="guide-link" href="/photo/m"><i data-lucide="smartphone"></i><span>모바일 화면</span></a><a class="guide-link" href="/guide.html"><i data-lucide="circle-help"></i><span>사용 방법</span></a><div id="session-state" class="session-state"><span class="status-dot"></span><span>연결 상태 확인 중</span></div><button id="btn-kidsnote-session" class="button button-dark"><i data-lucide="log-in"></i><span>키즈노트 로그인</span></button></div></header>
  <main class="download-workspace">
    <section class="finder-card">
      <div class="finder-controls"><label for="year-select">연도</label><select id="year-select"></select><button id="btn-load-photos" class="primary-button"><i data-lucide="search"></i><span>사진 조회</span></button><button id="btn-refresh" class="icon-button" title="상태 새로고침"><i data-lucide="refresh-cw"></i></button></div>
      <div id="lookup-progress" class="lookup-progress hidden"><span class="spinner"></span><div><strong>키즈노트 사진을 확인하고 있습니다</strong><p>사진은 서버에 저장하지 않습니다.</p></div></div>
      <div id="result-area" class="result-area hidden">
        <div class="result-toolbar"><div><label for="date-select">날짜 필터</label><select id="date-select"></select></div><div class="view-options" aria-label="한 줄 사진 개수"><span>한 줄</span><button class="view-button active" data-columns="3">3장</button><button class="view-button" data-columns="4">4장</button><button class="view-button" data-columns="5">5장</button></div><div class="result-summary"><span id="selected-count">0장</span><button id="btn-download-date" class="primary-button compact"><i data-lucide="archive"></i><span>연도 전체 받기</span></button></div></div>
        <div id="photo-list" class="photo-list gallery-grid columns-3"></div>
        <div id="empty-result" class="empty-result hidden"><i data-lucide="image-off"></i><strong>이 날짜에는 사진이 없습니다</strong><p>다른 날짜를 선택해 주세요.</p></div>
      </div>
      <div id="start-guide" class="start-guide"><i data-lucide="calendar-search"></i><strong>먼저 연도를 선택해 사진을 조회하세요</strong><p>조회 후 날짜별 사진 목록과 다운로드 버튼이 표시됩니다.</p></div>
    </section>
  </main>
</div>
<div id="kidsnote-login-modal" class="modal hidden" aria-hidden="true"><section class="dialog" role="dialog" aria-modal="true"><button id="kidsnote-login-close" class="dialog-close" aria-label="닫기"><i data-lucide="x"></i></button><div class="dialog-heading"><span><i data-lucide="shield-check"></i></span><div><small>SECURE CONNECTION</small><h2>키즈노트 계정 연결</h2></div></div><p class="dialog-description">사진을 조회할 키즈노트 계정으로 로그인해 주세요.</p><div class="security-note"><i data-lucide="lock-keyhole"></i><span>비밀번호는 저장하지 않고 암호화된 로그인 세션만 보관합니다.</span></div><form id="kidsnote-login-form" class="login-form"><label><span>아이디</span><input id="kidsnote-username" autocomplete="username" required placeholder="키즈노트 아이디"></label><label><span>비밀번호</span><input id="kidsnote-password" type="password" autocomplete="current-password" required placeholder="키즈노트 비밀번호"></label><p id="kidsnote-login-error" class="form-error hidden"></p><button id="btn-kidsnote-login" class="primary-button dialog-submit"><span>로그인하고 연결하기</span><i data-lucide="arrow-right"></i></button></form></section></div>
<div id="toast" class="toast"></div><script src="/pc-photo.js?v=20260816-split1"></script></body></html>
