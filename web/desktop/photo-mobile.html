<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="theme-color" content="#f5faf8"><title>사진 저장 | 키즈노트 사진 저장 도우미</title><link rel="icon" href="data:,"><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="/photo-mobile.css?v=20260816-3"></head>
<body><div class="mobile-app">
  <header class="mobile-header"><a class="mobile-brand" href="/photo/m"><span><i data-lucide="images"></i></span><strong>사진 저장 도우미</strong></a><div class="header-actions"><a href="/guide.html" aria-label="사용 방법"><i data-lucide="circle-help"></i></a><button id="btn-kidsnote-session" aria-label="키즈노트 로그인"><i data-lucide="log-in"></i></button></div></header>
  <main>
    <section class="account-strip"><span id="session-dot" class="session-dot"></span><div><small>키즈노트 계정</small><strong id="session-text">연결 상태 확인 중</strong></div><button id="btn-account-action">로그인</button></section>
    <section class="search-panel"><label for="year-select">사진을 찾을 연도</label><div class="year-row"><select id="year-select"></select><button id="btn-load-photos"><i data-lucide="search"></i><span>조회</span></button></div><p><i data-lucide="shield-check"></i> 사진은 서버에 저장하지 않습니다.</p></section>
    <section id="lookup-progress" class="loading-panel hidden"><span class="spinner"></span><strong>사진을 불러오고 있어요</strong><p>사진 수에 따라 잠시 걸릴 수 있습니다.</p></section>
    <section id="start-guide" class="empty-panel"><i data-lucide="calendar-search"></i><strong>연도를 선택하고 사진을 조회하세요</strong><p>최신 사진부터 날짜별로 보여드릴게요.</p></section>
    <section id="result-area" class="results hidden"><div class="result-head"><div><small>조회한 사진</small><strong id="photo-count">0장</strong></div><label for="date-select"><span>날짜</span><select id="date-select"></select></label></div><div id="photo-list" class="mobile-gallery"></div><div id="empty-result" class="empty-panel hidden"><i data-lucide="image-off"></i><strong>이 날짜에는 사진이 없어요</strong><p>다른 날짜를 선택해 주세요.</p></div></section>
  </main>
  <div id="download-bar" class="download-bar hidden"><div><small id="download-caption">선택한 연도</small><strong id="selected-count">0장</strong></div><button id="btn-download-date"><i data-lucide="archive"></i><span>전체 받기</span></button></div>
  <footer><a id="switch-pc" href="/photo/pc"><i data-lucide="monitor"></i>PC 화면으로 보기</a><p>키즈노트 운영사와 무관한 비공식 서비스입니다.</p></footer>
</div>
<div id="kidsnote-login-modal" class="modal hidden" aria-hidden="true"><section class="dialog" role="dialog" aria-modal="true"><div class="dialog-handle"></div><button id="kidsnote-login-close" class="dialog-close" aria-label="닫기"><i data-lucide="x"></i></button><span class="dialog-icon"><i data-lucide="shield-check"></i></span><h2>키즈노트 계정 연결</h2><p>사진을 조회할 키즈노트 계정으로 로그인해 주세요.</p><div class="security-note"><i data-lucide="lock-keyhole"></i>비밀번호는 저장하지 않습니다.</div><form id="kidsnote-login-form"><label>아이디<input id="kidsnote-username" autocomplete="username" required placeholder="키즈노트 아이디"></label><label>비밀번호<input id="kidsnote-password" type="password" autocomplete="current-password" required placeholder="키즈노트 비밀번호"></label><p id="kidsnote-login-error" class="form-error hidden"></p><button id="btn-kidsnote-login"><span>로그인하고 연결하기</span><i data-lucide="arrow-right"></i></button></form></section></div>
<div id="toast" class="toast"></div><script src="/photo-mobile.js?v=20260816-2"></script></body></html>
